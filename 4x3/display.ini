[Display]
; Arcade 4:3 picture with the bezel around it.
; "Display - 4x3.bat" copies this file into the game folder and sets
; Settings > WIDESCREEN to 4:3 (the bezel shows only with the 4:3 picture).
; The bezel stays in this folder: bezel.png is yours (your own artwork);
; without it the game uses bezel-default.png, which comes with the game.
Bezel = 4x3\bezel.png
